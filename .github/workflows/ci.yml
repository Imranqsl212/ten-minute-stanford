name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          MPLCONFIGDIR: .cache/matplotlib
        run: pytest

      - name: Audit publication outputs
        run: python scripts/audit_publication.py

      - name: Build Pages artifact
        run: python scripts/build_site.py --output _site
