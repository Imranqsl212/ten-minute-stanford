[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ten-minute-stanford"
version = "0.1.0"
description = "Reproducible analysis of Stanford classroom-to-classroom walking transitions."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Imran Zakirov" }, { name = "Alisher Sabitov" }]
keywords = ["data journalism", "Stanford", "routing", "OpenStreetMap", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "python-docx>=1.1,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
ten-minute-stanford = "ten_minute_stanford.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP"]
ignore = ["E501"]
